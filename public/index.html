<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Portal educativo sobre proteção da criança e do adolescente em Vitória da Conquista.">
  <title>Conselhos Tutelares — Vitória da Conquista</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <header class="header">
    <div class="header-logo" aria-hidden="true">CT</div>
    <div class="header-info">
      <div class="nome">Conselhos Tutelares</div>
      <div class="local">Vitória da Conquista — BA</div>
    </div>
    <button class="menu-btn" aria-label="Abrir menu" id="abrirMenu">
      <span></span><span></span><span></span>
    </button>
  </header>

  <div class="menu-overlay" id="menuOverlay"></div>
  <aside class="menu-lateral" id="menuLateral" aria-hidden="true">
    <button class="menu-fechar" aria-label="Fechar menu" id="fecharMenu">×</button>
    <nav>
      <a href="/">Início</a>
    </nav>
  </aside>

  <main>
    <!-- conteúdo será adicionado nos próximos passos -->
  </main>

  <script>
    const abrirMenu = document.getElementById('abrirMenu');
    const fecharMenu = document.getElementById('fecharMenu');
    const menuLateral = document.getElementById('menuLateral');
    const menuOverlay = document.getElementById('menuOverlay');

    function abrir() {
      menuLateral.classList.add('aberto');
      menuOverlay.classList.add('aberto');
    }

    function fechar() {
      menuLateral.classList.remove('aberto');
      menuOverlay.classList.remove('aberto');
    }

    abrirMenu.addEventListener('click', abrir);
    fecharMenu.addEventListener('click', fechar);
    menuOverlay.addEventListener('click', fechar);
  </script>

</body>
</html>

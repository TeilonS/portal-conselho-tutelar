<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Notícias — Painel Administrativo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-body">

  <div id="auth-loading" class="auth-loading">
    <div class="loading-spinner"></div>
    <span>Verificando acesso...</span>
  </div>

  <div id="admin-conteudo" hidden>

    <header class="admin-header">
      <div class="admin-header-info">
        <a href="/admin/dashboard" class="admin-voltar" aria-label="Voltar ao dashboard">←</a>
        <div>
          <div class="admin-titulo">Notícias e Campanhas</div>
          <div class="admin-usuario" id="usuario-email">—</div>
        </div>
      </div>
      <button id="btn-sair" class="btn-sair" type="button">Sair</button>
    </header>

    <main class="admin-main">

      <div class="admin-toolbar">
        <h1>Notícias</h1>
        <a href="/admin/noticia-form" class="btn btn-primario btn-novo">
          + Nova Notícia
        </a>
      </div>

      <div id="lista-noticias" class="lista-admin">
        <div class="faq-loading">
          <div class="loading-spinner"></div>
          <span>Carregando notícias...</span>
        </div>
      </div>

    </main>

  </div>

  <script type="module" src="/js/admin/noticias-admin.js"></script>
</body>
</html>

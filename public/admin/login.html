<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Login — Painel Administrativo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-body">

  <main class="login-container">

    <div class="login-card">

      <div class="login-header">
        <div class="login-logo" aria-hidden="true">
          <img src="/img/logo-mao.svg" alt="">
        </div>
        <h1>Painel Administrativo</h1>
        <p>Conselhos Tutelares — Vitória da Conquista</p>
      </div>

      <form id="form-login" class="login-form" novalidate>

        <div class="campo">
          <label for="email">E-mail</label>
          <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            required
            placeholder="seu.email@exemplo.com">
        </div>

        <div class="campo">
          <label for="senha">Senha</label>
          <input
            type="password"
            id="senha"
            name="senha"
            autocomplete="current-password"
            required
            placeholder="••••••••">
        </div>

        <div id="erro-mensagem" class="aviso aviso-erro" hidden></div>

        <button type="submit" class="btn btn-primario" id="btn-entrar">
          🔐 Entrar
        </button>

      </form>

      <div class="login-rodape">
        <a href="/" class="voltar-site">← Voltar ao site público</a>
      </div>

    </div>

  </main>

  <script type="module" src="/js/admin/login.js"></script>
</body>
</html>
